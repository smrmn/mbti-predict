name: Deploy to server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            if [ ! -d /opt/mbti-predict ]; then
              git clone git@github.com:smrmn/mbti-predict.git /opt/mbti-predict
            fi

            cd /opt/mbti-predict
            git pull origin main

            pip3 install -r requirements.txt --quiet

            {
              echo "BOT_TOKEN=${{ secrets.BOT_TOKEN }}"
              echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}"
              echo "DAILY_HOUR=9"
              echo "DAILY_MINUTE=0"
            } > .env
            chmod 600 .env

            systemctl restart mbti-predict
            sleep 3
            systemctl is-active mbti-predict
